name: Release

# Every push to main that passes CI is released automatically. The next
# version comes from the Conventional Commits since the last tag (see
# hack/next-version.sh): feat → minor, fix/perf/deps → patch, breaking →
# major (minor before 1.0). Commits that are only chore/ci/docs/… are not
# released.
#
# Tagging and GoReleaser run in one job because a tag pushed with
# GITHUB_TOKEN does not trigger other workflows.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One release at a time, in order, so two quick merges can't compute the
# same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Tag and release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the release, upload assets
      packages: write # push images to GHCR
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Release exactly the commit CI tested, even if main moved on.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # A re-run for an already-tagged commit re-releases that tag.
          tag=$(git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -n1)

          if [[ -z "$tag" ]]; then
            tag=$(hack/next-version.sh)
            new=true
          else
            new=false
          fi

          if [[ -z "$tag" ]]; then
            echo "No releasable commits since $(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'the beginning'); skipping." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Releasing $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.version.outputs.tag != '' && steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: steps.version.outputs.tag != ''
        with:
          go-version-file: go.mod
          # setup-go's cache is shared with lint/test and only ever holds
          # native linux/amd64 builds; GoReleaser uses its own below.
          cache: false

      # Shared with the PR snapshot job. Saved from main, so PRs can read it.
      - name: Restore GoReleaser Go cache
        if: steps.version.outputs.tag != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: goreleaser-go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            goreleaser-go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            goreleaser-go-${{ runner.os }}-

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.version.outputs.tag != ''
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        if: steps.version.outputs.tag != ''
      # No QEMU: the image only COPYs prebuilt binaries, and the CA stage runs
      # on the build platform, so nothing executes under emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.version.outputs.tag != ''

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: steps.version.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        if: steps.version.outputs.tag != ''
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}

      - name: Save GoReleaser Go cache
        if: steps.version.outputs.tag != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: goreleaser-go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
